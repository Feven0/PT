version: "3"
services:
  ipersona_prod:
    container_name: ipersona_prod
    build: .
    image: ipersona_prod:latest
    restart: unless-stopped
    environment:
      - STRAPI_STAGE=dev-prod
      - PORT=4900
      - APP_MODULE=app:app
      - WORKERS_PER_CORE=0.5
      - TIMEOUT=120
      - KEEP_ALIVE=60
      - LOG_LEVEL=info      - 
    networks:
      - ipersona_network    
    # volumes:
    #   - /mnt/efs:/mnt/efs
    expose:
      - 4900 
    ports:
      - "4900:4900"

networks:
    ipersona_network:
        name: ipersona_prod
        driver: bridge      

