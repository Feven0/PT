openapi: 3.0.0
info:
  title: tenx_ipersona API
  version: 1.0.0
  description: |
    Comprehensive REST API documentation for the tenx_ipersona platform, including all endpoints for audio, session, template, challenge, and admin operations. Each endpoint includes header, parameters, body, response, and field-level details, with realistic examples. This file is Theneo-ready and suitable for developer onboarding and integration.
servers:
  - url: https://your-production-url/api
paths:
  /audio_upload:
    post:
      tags: [Audio Endpoints]
      summary: Upload audio file and transcribe to text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioUploadRequest'
            example:
              file: '<binary-audio-file>'
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadResponse'
              example:
                transcription: 'This is the transcribed text.'
                status: 200
                message: ''
        '400':
          description: Invalid file or error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadErrorResponse'
              example:
                transcription: 'Failed'
                status: 400
                message: 'No file provided or invalid file'

  /audio_upload_external:
    post:
      tags: [Audio Endpoints]
      summary: Upload an audio file for external transcription and analysis
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioUploadRequest'
            example:
              file: '<binary-audio-file>'
      responses:
        '200':
          description: Successful transcription and analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadExternalResponse'
              example:
                chat:
                  question: 'What is your experience with Python?'
                  answer: 'I have 3 years of experience.'
                  evaluation: 'Good answer.'
                status: 200
                message: 'Audio Successfully Transcribed'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadExternalErrorResponse'
              example:
                transcription: 'Failed'
                status: 500
                message: 'System error: <error details>'

  /external_data_saving:
    post:
      tags: [Audio Endpoints]
      summary: Save external audio transcription and chat data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalDataSavingRequest'
            example:
              run_stage: dev
              transcribe_chat: [ { question: 'What is OOP?', answer: 'Object Oriented Programming' } ]
              all_user_id: 197
              job_profile_id: 46
      responses:
        '200':
          description: Chat saved and evaluation calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDataSavingResponse'
              example:
                chat:
                  id: 1
                  messages: [ { question: 'What is OOP?', answer: 'Object Oriented Programming' } ]
                overall:
                  score: 85
                  feedback: 'Good performance.'
                status: 200
                message: 'Chat Saved Successfully'
        '400':
          description: Chat not saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDataSavingErrorResponse'
              example:
                chat: []
                status: 400
                message: 'Chat Not Saved'
        '404':
          description: No trainee user profiles found for the given all_user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
              example:
                error: 'No trainee user profiles found for the given all_user_id'
        '500':
          description: Error processing user session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: 'Error processing user session: <error details>'

  /create_user_session:
    post:
      tags: [Session Endpoints]
      summary: Create a user session and generate interview questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSessionRequestRecieved'
            example:
              all_user_id: 123
              job_profile_id: 456
              run_stage: 'dev'
              template: true
              external: false
              challenge: false
              template_id: 789
              challenge_id: 101
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionResponse'
              example:
                id: 1
                status: 'Incomplete'
                template_id: 789
                challenge_id: 101
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
              example:
                error: 'Missing required parameters'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: 'Failed to generate interview questions'

  /clarify:
    post:
      tags: [Session Endpoints]
      summary: Clarify a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationRequestRecieved'
            example:
              question: 'Can you explain your experience with Python?'
      responses:
        '200':
          description: Clarification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationResponse'
              example:
                clarification: 'Please describe your experience working with Python, including specific projects.'
        '400':
          description: Invalid or missing question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
              example:
                error: 'Invalid or missing question.'
        '500':
          description: Clarification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: "Key error: 'question'"

  /delete_session:
    post:
      tags: [Session Endpoints]
      summary: Mark an interview session as deleted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSessionRequest'
            example:
              run_stage: dev
              sessionId: 1234
      responses:
        '200':
          description: Session deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSessionSuccessResponse'
              example:
                success: 'Session deleted successfully'
        '400':
          description: Missing session ID in request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
              example:
                error: 'Session ID is required'
        '404':
          description: Session not found or could not be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
              example:
                error: 'Session not found or could not be updated'
        '500':
          description: Error deleting session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: 'Error deleting session: <error details>'

  /close_session:
    post:
      tags: [Session Endpoints]
      summary: Close an interview session and perform final evaluations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseSessionRequest'
            example:
              run_stage: dev
              data:
                sessionId: 1234
                responses:
                  - 'Yes'
                  - 'No'
      responses:
        '200':
          description: Session closed and evaluated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseSessionSuccessResponse'
              example:
                success:
                  score: 85
                  feedback: 'Good performance.'
        '400':
          description: Missing session data in request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
              example:
                error: 'Session data is required'
        '500':
          description: Error closing session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: 'Error closing session: <error details>'

  /calculate_session_overall_progress:
    post:
      tags: [Session Endpoints]
      summary: Fetch overall progress metrics for a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateSessionOverallProgressRequest'
            example:
              run_stage: dev
              job_profile_id: 46
              challenge_id: 101
              all_user_id: 197
      responses:
        '200':
          description: Successfully fetched session data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateSessionOverallProgressResponse'
              examples:
                normal:
                  value:
                    overall_clarity:
                      - time: '12 Feb 2025 07:02 AM'
                        level: 'good'
                        value: 2
                    overall_competency:
                      - time: '12 Feb 2025 07:02 AM'
                        competency:
                          - name: 'Software Engineering'
                            sfia_level: '3'
                    overall_confidence:
                      - time: '12 Feb 2025 07:02 AM'
                        level: 'good'
                        value: 2
                    overall_engagement:
                      - time: '12 Feb 2025 07:02 AM'
                        level: 'good'
                        value: 2
                    overall_performance:
                      - time: '12 Feb 2025 07:02 AM'
                        score: 92
                    overall_time_management:
                      - time: '12 Feb 2025 07:02 AM'
                        time_management:
                          fail: 1
                          pass: 10
                          total_time_taken_by_candidate: '00:08:10'
                no_data:
                  value:
                    message: 'No session overall observer data found.'
        '500':
          description: Unexpected error during session progress calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: 'Unexpected error: <error details>'

  /calculate_allstat_progress:
    post:
      tags: [Session Endpoints]
      summary: Calculates overall users' progress metrics for all job types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateAllStatProgressRequest'
            example:
              run_stage: dev
              all_user_id: 197
      responses:
        '200':
          description: Progress metrics successfully calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateAllStatProgressResponse'
              example:
                average_score: 78
                jobs:
                  - job_profile_id: 46
                    score: 80
                  - job_profile_id: 47
                    score: 76
        '400':
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
              example:
                error: 'Invalid request format.'
        '500':
          description: Error calculating progress metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: 'Unexpected error occurred: <error details>'
  
