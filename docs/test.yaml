  /fetch_user_session:
    post:
      tags: [Session Endpoints]
      summary: Fetch session data for a specific user and job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchUserSessionRequest'
            example:
              run_stage: dev
              all_user_id: 197
              job_profile_id: 46
              template_id: 789
              challenge_id: 101
              since: 1
      responses:
        '200':
          description: Session data for the user and job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchUserSessionResponse'
              example:
                session_id: 1234
                status: 'active'
                job_profile_id: 46
        '404':
          description: No trainee user profiles found for user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
              example:
                message: 'No trainee user profiles found for user ID: 197'
        '500':
          description: Error fetching user session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: 'Error fetching user session: <error details>'

  /fetch_chat_history:
    post:
      tags: [Session Endpoints]
      summary: Fetch chat message history for a specific session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchChatHistoryRequest'
            example:
              run_stage: dev
              sessionId: 1234
      responses:
        '200':
          description: List of chat messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchChatHistoryResponse'
              example:
                messages:
                  - sender: 'user'
                    message: 'Hello'
                  - sender: 'assistant'
                    message: 'Hi, how can I help you?'
        '404':
          description: No chat history found for session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
              example:
                message: 'No chat history found for session ID: 1234'
        '500':
          description: Error fetching chat history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: 'Error fetching chat history: <error details>'

  /fetch_user_all_observer:
    post:
      tags: [Session Endpoints]
      summary: Fetch all observers for a specific session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchUserAllObserverRequest'
            example:
              run_stage: dev
              sessionId: 1234
      responses:
        '200':
          description: List of observers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchUserAllObserverResponse'
              example:
                observers:
                  - observer_id: 1
                    name: 'Observer 1'
                  - observer_id: 2
                    name: 'Observer 2'
        '404':
          description: No observers found for session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
              example:
                message: 'No observers found for session ID: 1234'
        '500':
