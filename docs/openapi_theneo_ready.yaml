# The file will be fully rewritten in batches. This batch will include the first 10 endpoints in strict Theneo-compatible OpenAPI 3.0.0 format, with $ref for schemas, all schemas in components/schemas, and all examples at the correct level. Parameters will be included as OpenAPI parameter objects where needed. No endpoints omitted.
openapi: 3.0.0
info:
  title: tenx_ipersona API
  version: 1.0.0
  description: |
    Comprehensive REST API documentation for the tenx_ipersona platform, including all endpoints for audio, session, template, challenge, and admin operations. Each endpoint includes header, parameters, body, response, and field-level details, with realistic examples. This file is Theneo-ready and suitable for developer onboarding and integration.
servers:
  - url: https://your-production-url/api
paths:
  /audio_upload:
    post:
      tags: [Audio Endpoints]
      summary: Upload audio file and transcribe to text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioUploadRequest'
            example:
              file: '<binary-audio-file>'
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadResponse'
              example:
                transcription: 'This is the transcribed text.'
                status: 200
                message: ''
        '400':
          description: Invalid file or error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadErrorResponse'
              example:
                transcription: 'Failed'
                status: 400
                message: 'No file provided or invalid file'

  /audio_upload_external:
    post:
      tags: [Audio Endpoints]
      summary: Upload an audio file for external transcription and analysis
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioUploadRequest'
            example:
              file: '<binary-audio-file>'
      responses:
        '200':
          description: Successful transcription and analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadExternalResponse'
              example:
                chat:
                  question: 'What is your experience with Python?'
                  answer: 'I have 3 years of experience.'
                  evaluation: 'Good answer.'
                status: 200
                message: 'Audio Successfully Transcribed'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadExternalErrorResponse'
              example:
                transcription: 'Failed'
                status: 500
                message: 'System error: <error details>'

  /external_data_saving:
    post:
      tags: [Audio Endpoints]
      summary: Save external audio transcription and chat data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalDataSavingRequest'
            example:
              run_stage: dev
              transcribe_chat: [ { question: 'What is OOP?', answer: 'Object Oriented Programming' } ]
              all_user_id: 197
              job_profile_id: 46
      responses:
        '200':
          description: Chat saved and evaluation calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDataSavingResponse'
              example:
                chat:
                  id: 1
                  messages: [ { question: 'What is OOP?', answer: 'Object Oriented Programming' } ]
                overall:
                  score: 85
                  feedback: 'Good performance.'
                status: 200
                message: 'Chat Saved Successfully'
        '400':
          description: Chat not saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDataSavingErrorResponse'
              example:
                chat: []
                status: 400
                message: 'Chat Not Saved'
        '404':
          description: No trainee user profiles found for the given all_user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
              example:
                error: 'No trainee user profiles found for the given all_user_id'
        '500':
          description: Error processing user session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: 'Error processing user session: <error details>'

  /create_user_session:
    post:
      tags: [Session Endpoints]
      summary: Create a user session and generate interview questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSessionRequestRecieved'
            example:
              all_user_id: 123
              job_profile_id: 456
              run_stage: 'dev'
              template: true
              external: false
              challenge: false
              template_id: 789
              challenge_id: 101
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionResponse'
              example:
                id: 1
                status: 'Incomplete'
                template_id: 789
                challenge_id: 101
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
              example:
                error: 'Missing required parameters'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: 'Failed to generate interview questions'

  /clarify:
    post:
      tags: [Session Endpoints]
      summary: Clarify a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationRequestRecieved'
            example:
              question: 'Can you explain your experience with Python?'
      responses:
        '200':
          description: Clarification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationResponse'
              example:
                clarification: 'Please describe your experience working with Python, including specific projects.'
        '400':
          description: Invalid or missing question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
              example:
                error: 'Invalid or missing question.'
        '500':
          description: Clarification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                error: "Key error: 'question'"

components:
  schemas:
    AudioUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
    AudioUploadResponse:
      type: object
      properties:
        transcription:
          type: string
        status:
          type: integer
        message:
          type: string
    AudioUploadErrorResponse:
      type: object
      properties:
        transcription:
          type: string
        status:
          type: integer
        message:
          type: string
    AudioUploadExternalResponse:
      type: object
      properties:
        chat:
          type: object
        status:
          type: integer
        message:
          type: string
    AudioUploadExternalErrorResponse:
      type: object
      properties:
        transcription:
          type: string
        status:
          type: integer
        message:
          type: string
    ExternalDataSavingRequest:
      type: object
      properties:
        run_stage:
          type: string
        transcribe_chat:
          type: array
          items:
            type: object
        all_user_id:
          type: integer
        job_profile_id:
          type: integer
    ExternalDataSavingResponse:
      type: object
      properties:
        chat:
          type: object
        overall:
          type: object
        status:
          type: integer
        message:
          type: string
    ExternalDataSavingErrorResponse:
      type: object
      properties:
        chat:
          type: array
          items:
            type: object
        status:
          type: integer
        message:
          type: string
    NotFoundErrorResponse:
      type: object
      properties:
        error:
          type: string
    ServerErrorResponse:
      type: object
      properties:
        error:
          type: string
    UserSessionRequestRecieved:
      type: object
      properties:
        all_user_id:
          type: integer
        job_profile_id:
          type: integer
        run_stage:
          type: string
        template:
          type: boolean
        external:
          type: boolean
        challenge:
          type: boolean
        template_id:
          type: integer
        challenge_id:
          type: integer
    UserSessionResponse:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        template_id:
          type: integer
        challenge_id:
          type: integer
    BadRequestErrorResponse:
      type: object
      properties:
        error:
          type: string
    ClarificationRequestRecieved:
      type: object
      properties:
        question:
          type: string
    ClarificationResponse:
      type: object
      properties:
        clarification:
          type: string

