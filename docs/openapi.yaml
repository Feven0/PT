openapi: 3.0.0
info:
  title: tenx_ipersona API
  version: 1.0.0
  description: |
    REST API for tenx_ipersona. This spec is auto-generated for Theneo import and includes all endpoints for session management, audio processing, admin, and template features. Every endpoint includes detailed example payloads for both request and response.
servers:
  - url: /api
paths:
  /audio_upload:
    post:
      tags: [Audio Endpoints]
      summary: Upload audio file and transcribe to text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            example:
              file: "<binary-audio-file>"
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcription:
                    type: string
                  status:
                    type: integer
                  message:
                    type: string
              example:
                transcription: "This is the transcribed text."
                status: 200
                message: ""
        '400':
          description: Invalid file or error
          content:
            application/json:
              example:
                transcription: "Failed"
                status: 400
                message: "No file provided or invalid file"
  /create_user_session:
    post:
      tags: [Session Endpoints]
      summary: Create a user session and generate interview questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSessionRequestRecieved'
            example:
              all_user_id: 123
              job_profile_id: 456
              run_stage: "dev"
              template: true
              external: false
              challenge: false
              template_id: 789
              challenge_id: 101
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionResponse'
              example:
                id: 1
                status: "Incomplete"
                template_id: 789
                challenge_id: 101
        '400':
          description: Missing required parameters
          content:
            application/json:
              example:
                error: "Missing required parameters"
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: "Failed to generate interview questions"
  /clarify:
    post:
      tags: [Session Endpoints]
      summary: Clarify a given question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationRequestRecieved'
            example:
              question: "Can you clarify what you mean by 'agile'?"
      responses:
        '200':
          description: Clarification result
          content:
            application/json:
              schema:
                type: object
              example:
                clarification: "Agile refers to a set of principles for software development under which requirements and solutions evolve through the collaborative effort of cross-functional teams."
        '400':
          description: Invalid or missing question
          content:
            application/json:
              example:
                error: "Invalid or missing question."
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: "Key error: 'question'"
  /delete_session:
    post:
      tags: [Session Endpoints]
      summary: Mark an interview session as deleted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionIdRequestRecieved'
            example:
              sessionId: 1
              run_stage: "dev"
      responses:
        '200':
          description: Session deleted
          content:
            application/json:
              example:
                success: "Session deleted successfully"
        '400':
          description: Missing session ID
          content:
            application/json:
              example:
                error: "Session ID is required"
        '404':
          description: Session not found
          content:
            application/json:
              example:
                error: "Session not found or could not be updated"
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: "Error deleting session: <details>"
  /close_session:
    post:
      tags: [Session Endpoints]
      summary: Close an interview session and perform final evaluations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosedDataRequestRecieved'
            example:
              run_stage: "dev"
              data:
                sessionId: 1
                evaluation: { ... }
      responses:
        '200':
          description: Session closed and evaluated
          content:
            application/json:
              example:
                success: { "score": 95, "feedback": "Great session." }
        '400':
          description: Missing session data
          content:
            application/json:
              example:
                error: "Session data is required"
        '500':
          description: Server error
          content:
            application/json:
              example:
                error: "Error closing session: <details>"
  /calculate_session_overall_progress:
    post:
      tags: [Session Endpoints]
      summary: Fetch overall progress metrics for a job
      requestBody:
        required: true
        content:
