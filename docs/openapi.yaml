              filter: {}
              return_skip: false
              information_level: "basic"
              since: 1
              limit: 10
              cursor: {}
      responses:
        '200':
          description: Engagement summary
          content:
            application/json:
              example:
                all_user_id: 123
                jobs: [ { job_id: 1, status: "completed" } ]
                status: 200
                message: ""
        '400':
          description: Missing user ID
          content:
            application/json:
              example:
                all_user_id: []
                jobs: []
                status: 400
                message: "User ID is required"
        '500':
          description: Server error
