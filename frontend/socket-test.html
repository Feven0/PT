<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Socket Test</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; }
      #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 12px; border-radius: 8px; min-height: 180px; }
      input, button { font-size: 16px; padding: 8px; }
    </style>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  </head>
  <body>
    <h1>Socket Test</h1>

    <div>
      <label>Server URL: <input id="serverUrl" size="40" value="http://localhost:9990" /></label>
      <button id="connectBtn">Connect</button>
    </div>

    <div style="margin-top:12px;">
      <label>Client ID: <input id="clientId" size="24" placeholder="test-client-1" /></label>
      <button id="registerBtn">Register SID</button>
      <button id="triggerSidBtn">Trigger by SID (no join)</button>
    </div>

    <div style="margin-top:12px;">
      <label>Job ID (room): <input id="jobId" size="24" placeholder="123" /></label>
      <button id="joinBtn">Join Room</button>
      <button id="leaveBtn">Leave Room</button>
      <button id="triggerBtn">Trigger Celery Emit (/tasks/socket-test)</button>
      <button id="triggerCeleryApiBtn">Trigger Test Celery Event (/api/test_celery_event)</button>
      <button id="triggerBySidBtn">Trigger By SID (/api/test_celery_event_by_sid)</button>
      <button id="directBtn">Trigger Direct Emit</button>
    </div>

    <h3>Log</h3>
    <div id="log"></div>

    <script>
      const ts = () => new Date().toISOString().split("T")[1].replace("Z", "");
      const log = (m) => {
        const el = document.getElementById('log');
        const line = (typeof m === 'string' ? m : JSON.stringify(m));
        const entry = `[${ts()}] ${line}`;
        el.textContent += entry + "\n";
        console.debug(entry);
        el.scrollTop = el.scrollHeight;
      };

      let socket;
      document.getElementById('connectBtn').onclick = () => {
        if (typeof io === 'undefined') {
          log('Socket.IO client not loaded. Check network/console and reload.');
          return;
        }
        const url = document.getElementById('serverUrl').value.trim();
        if (socket && socket.connected) socket.disconnect();
        socket = io(url, { transports: ['websocket'] });
        socket.on('connect', () => log({ event: 'connect', sid: socket.id }));
        socket.on('disconnect', (r) => log({ event: 'disconnect', reason: r }));
        socket.on('connect_error', (e) => log({ event: 'connect_error', message: e.message }));
        socket.on('socket_test', (data) => log(['socket_test', data]));
        socket.on('processing_update_failed', (data) => log(['processing_update_failed', data]));
        socket.on('processing_update_success', (data) => log(['processing_update_success', data]));
        // Catch-all: log every event we receive with payload
        socket.onAny((event, ...args) => {
          log(['onAny', event, args?.[0] ?? null]);
        });
        // Auto-register client id
        let cid = document.getElementById('clientId').value.trim();
        if (!cid) {
          cid = `client-${Math.random().toString(36).slice(2,8)}`;
          document.getElementById('clientId').value = cid;
        }
        socket.emit('register', { client_id: cid });
        log({ event: 'register', client_id: cid, sid: socket.id });
        socket.on('progress_update', (data) => log(['progress_update', data]));
      };

      let currentRoom = null;
      document.getElementById('joinBtn').onclick = async () => {
        const jobId = document.getElementById('jobId').value.trim();
        if (!jobId) { log('join: missing job id'); return; }
        const room = `processing_${jobId}`;
        try {
          log({ action: 'join_attempt', room });
          socket.emit('join', { room });
          currentRoom = room;
          log({ action: 'join_set_client_room', room });
        } catch (e) {
          log({ action: 'join_error', error: e.message });
        }
      };

      document.getElementById('registerBtn').onclick = () => {
        const cid = document.getElementById('clientId').value.trim() || `client-${Math.random().toString(36).slice(2,8)}`;
        document.getElementById('clientId').value = cid;
        socket.emit('register', { client_id: cid });
        log(['registered', cid]);
      };

      document.getElementById('leaveBtn').onclick = async () => {
        const jobId = document.getElementById('jobId').value.trim();
        if (!jobId) { log('leave: missing job id'); return; }
        const room = `processing_${jobId}`;
        try {
          log({ action: 'leave_attempt', room });
          socket.emit('leave', { room });
          if (currentRoom === room) currentRoom = null;
          log({ action: 'leave_set_client_room', room, currentRoom });
        } catch (e) {
          log({ action: 'leave_error', error: e.message });
        }
      };

      document.getElementById('triggerSidBtn').onclick = async () => {
        const url = document.getElementById('serverUrl').value.trim();
        if (!url) return log('enter server url');
        if (!socket || !socket.connected) { alert('Connect first'); return; }
        try {
          const sid = socket.id;
          const res = await fetch(`${url.replace(/\/$/, '')}/tasks/socket-test-by-sid?sid=${encodeURIComponent(sid)}`, { method: 'POST' });
          const json = await res.json().catch(() => ({}));
          log(['bySid', res.status, json]);
        } catch (e) {
          log(`bySid error: ${e.message}`);
        }
      };

      document.getElementById('triggerBtn').onclick = async () => {
        const url = document.getElementById('serverUrl').value.trim();
        const jobId = document.getElementById('jobId').value.trim();
        if (!url) return log('enter server url');
        if (!jobId) return log('enter job id');
        try {
          const res = await fetch(`${url.replace(/\/$/, '')}/tasks/socket-test?job_id=${encodeURIComponent(jobId)}&message=${encodeURIComponent('hello-from-frontend')}`, { method: 'POST' });
          const json = await res.json().catch(() => ({}));
          log(['triggered', res.status, json]);
        } catch (e) {
          log(`trigger error: ${e.message}`);
        }
      };

      document.getElementById('directBtn').onclick = async () => {
        const url = document.getElementById('serverUrl').value.trim();
        const jobId = document.getElementById('jobId').value.trim();
        if (!url) return log('enter server url');
        if (!jobId) return log('enter job id');
        try {
          const res = await fetch(`${url.replace(/\/$/, '')}/tasks/socket-direct?job_id=${encodeURIComponent(jobId)}&message=${encodeURIComponent('hello-from-direct')}`, { method: 'POST' });
          const json = await res.json().catch(() => ({}));
          log(['direct', res.status, json]);
        } catch (e) {
          log(`direct error: ${e.message}`);
        }
      };

      // Call the new FastAPI route that enqueues emit_simple_event_task
      document.getElementById('triggerCeleryApiBtn').onclick = async () => {
        const url = document.getElementById('serverUrl').value.trim();
        if (!url) return log('enter server url');
        try {
          const sid = (typeof socket !== 'undefined' && socket && socket.connected) ? socket.id : null;
          const base = `${url.replace(/\/$/, '')}/api/test_celery_event`;
          const full = sid ? `${base}?sid=${encodeURIComponent(sid)}` : base;
          log({ action: 'call_test_celery_event', mode: sid ? 'sid' : 'room', sid, currentRoom });
          const res = await fetch(full, { method: 'POST' });
          const json = await res.json().catch(() => ({}));
          log(['triggerCeleryApi', res.status, json]);
        } catch (e) {
          log(`triggerCeleryApi error: ${e.message}`);
        }
      };

      document.getElementById('triggerBySidBtn').onclick = async () => {
        const url = document.getElementById('serverUrl').value.trim();
        if (!url) return log('enter server url');
        if (!socket || !socket.connected) { alert('Connect first'); return; }
        try {
          const sid = socket.id;
          log({ action: 'call_test_celery_event_by_sid', sid });
          const res = await fetch(`${url.replace(/\/$/, '')}/api/test_celery_event_by_sid?sid=${encodeURIComponent(sid)}&message=${encodeURIComponent('hello-from-by-sid')}`, { method: 'POST' });
          const json = await res.json().catch(() => ({}));
          log(['triggerBySid', res.status, json]);
        } catch (e) {
          log(`triggerBySid error: ${e.message}`);
        }
      };
    </script>
  </body>
  </html>
