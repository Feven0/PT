[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--asyncio-mode=auto",
    "--randomly-seed=1234",
    "--randomly-dont-reset-seed",
    "--durations=10",
    "--maxfail=10",
    "--showlocals",
    "--disable-warnings",
    "--import-mode=importlib"
]
markers = [
    "asyncio: mark test as async/await test",
    "integration: mark test as integration test",
    "unit: mark test as unit test",
    "api: mark test as API endpoint test",
    "repository: mark test as repository test",
    "service: mark test as service test",
    "infrastructure: mark test as infrastructure test",
    "core: mark test as core functionality test",
    "slow: mark test as slow running test",
    "env: mark test as environment dependent",
    "external: mark test as requiring external services"
]
norecursedirs = [
    "*.egg",
    ".eggs",
    "dist",
    "build",
    "docs",
    ".tox",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "venv",
    ".env",
    "env",
    "..*"
]

[tool.coverage.run]
branch = false
source = ["backend"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError"
]

[tool.coverage.html]
directory = "coverage" 