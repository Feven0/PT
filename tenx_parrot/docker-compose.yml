version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - STORAGE_TYPE=${STORAGE_TYPE:-strapi}
      - REDIS_HOST=redis
    depends_on:
      - redis
      - ${STORAGE_TYPE:-strapi}
    volumes:
      - .:/app
    networks:
      - backend

  strapi:
    image: strapi/strapi:latest
    profiles:
      - strapi
    ports:
      - "1337:1337"
    environment:
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
    volumes:
      - strapi_data:/srv/app
    networks:
      - backend

  weaviate:
    image: semitechnologies/weaviate:latest
    profiles:
      - weaviate
    ports:
      - "8080:8080"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=text2vec-transformers
      - ENABLE_MODULES=text2vec-transformers
      - TRANSFORMERS_INFERENCE_API=http://t2v-transformers:8080
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - backend

  t2v-transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-multi-qa-MiniLM-L6-cos-v1
    profiles:
      - weaviate
    environment:
      - ENABLE_CUDA=0
    networks:
      - backend

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - backend

volumes:
  strapi_data:
  weaviate_data:
  redis_data:
  prometheus_data:

networks:
  backend:

