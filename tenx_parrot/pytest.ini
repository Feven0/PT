[pytest]
# Test discovery paths - explicitly set to backend tests only
testpaths = tests
norecursedirs = 
    .git 
    .venv 
    venv 
    build 
    dist 
    *.egg-info 
    .pytest_cache 
    __pycache__ 
    .mypy_cache 
    .coverage 
    htmlcov
    ..
    ../..
    ../../..

# Python path settings
pythonpath = .
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --asyncio-mode=auto
    --randomly-seed=1234
    --randomly-dont-reset-seed
    --durations=10
    --maxfail=10
    --showlocals
    --import-mode=importlib
    --ignore=../
    --ignore=../../

# Test patterns
python_files = tests/test_*.py
python_classes = tests/Test*
python_functions = tests/test_*

# Test markers
markers =
    asyncio: mark test as async/await test
    integration: mark test as integration test
    unit: mark test as unit test
    api: mark test as API endpoint test
    repository: mark test as repository test
    service: mark test as service test
    infrastructure: mark test as infrastructure test
    core: mark test as core functionality test
    slow: mark test as slow running test
    env: mark test as environment dependent
    external: mark test as requiring external services

# Environment settings
env =
    D:ENVIRONMENT=test
    D:MOCK_EXTERNAL_SERVICES=true
    D:TEST_TIMEOUT=30
    D:ASYNC_TEST_TIMEOUT=60

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test timeouts
timeout = 300

[coverage:run]
branch = False
source = .
relative_files = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError

[coverage:html]
directory = coverage 